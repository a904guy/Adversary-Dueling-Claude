<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Live run</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #0e1014; --panel: #14171d; --raised: #1b1f27; --line: #262b35; --line2: #303744;
  --text: #e6e9ef; --muted: #8b93a3; --faint: #5d6575;
  --worker: #3fc1a5; --super: #a78bfa; --person: #f5b14c; --perm: #f87171; --task: #60a5fa; --bridge: #94a3b8;
  --ok: #4ade80; --err: #f87171; --code: #0b0d11;
  --r: 12px; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root { --bg:#f4f5f8; --panel:#ffffff; --raised:#f7f8fa; --line:#e3e6ec; --line2:#d5d9e1; --text:#171a21;
          --muted:#5d6575; --faint:#8b93a3; --code:#f2f4f7; --worker:#0f9f83; --super:#7c3aed; --person:#c27c0e;
          --perm:#dc2626; --task:#2563eb; --bridge:#64748b; --ok:#16a34a; --err:#dc2626; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; flex-direction: column;
       overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: var(--task); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); min-height: 52px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.live.on i { background: var(--ok); box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
.title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.ro { font-size: 11px; color: var(--muted); border: 1px solid var(--line2); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.tabs { display: none; gap: 4px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 3px; width: 100%; }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 13px var(--sans); padding: 7px 8px;
               border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
.tabs button.sel { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); position: relative; }
.pane:last-child { border-right: 0; }
.phead { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); font-weight: 600; font-size: 13px; letter-spacing: .02em; }
.phead .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.busy .dot, .dot.busy { animation: blink 1.2s ease-in-out infinite; }
[data-role=worker] .dot, .dot.worker { background: var(--worker); }
[data-role=adversary] .dot, .dot.adversary { background: var(--super); }
@keyframes blink { 50% { opacity: .25; } }
.state { margin-left: auto; font-weight: 500; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.feed { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: auto; }
.feed > * { flex: none; }
.empty { color: var(--faint); text-align: center; margin: auto; font-size: 13px; }
.jump { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); border: 1px solid var(--line2);
        background: var(--raised); color: var(--text); border-radius: 999px; padding: 6px 14px; font: 600 12px var(--sans);
        cursor: pointer; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.jump.show { display: block; }

/* messages */
.msg { border-radius: var(--r); padding: 10px 14px; max-width: 100%; overflow-wrap: anywhere; }
.msg .who { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
            text-transform: uppercase; margin-bottom: 4px; }
.msg .who time { margin-left: auto; font-weight: 400; color: var(--faint); letter-spacing: 0; text-transform: none; }
.in { background: var(--raised); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--bridge)); }
.in .who { color: var(--c, var(--bridge)); }
.out { background: transparent; padding-left: 4px; padding-right: 4px; }
.out .who { color: var(--c); }
.src-supervisor { --c: var(--super); } .src-worker { --c: var(--worker); } .src-person { --c: var(--person); }
.src-permission { --c: var(--perm); } .src-task { --c: var(--task); } .src-bridge, .src-typed { --c: var(--bridge); }
.role-worker { --c: var(--worker); } .role-adversary { --c: var(--super); }
.collapsed .md { max-height: 220px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.more { border: 0; background: none; color: var(--task); font: 600 12px var(--sans); padding: 4px 0 0; cursor: pointer; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; }
.md h1, .md h2, .md h3, .md h4 { font-size: 14px; margin: 12px 0 4px; }
.md code { font: 12.5px var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.md pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.md pre code { border: 0; padding: 0; background: none; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line2); color: var(--muted); }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }

/* thinking, tools */
.chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
        background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: default; }
.chip.can { cursor: pointer; }
.thought { font-size: 13px; color: var(--muted); white-space: pre-wrap; border-left: 2px solid var(--line2); padding: 2px 0 2px 10px; margin: -4px 0 0 8px; }
.tool { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; overflow: hidden; }
.tool > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; min-width: 0; }
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--raised); }
.ticon { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; flex: none;
         background: var(--raised); border: 1px solid var(--line2); color: var(--muted); font-weight: 700; }
.tname { font-weight: 600; flex: none; }
.tsum { color: var(--muted); font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.tstat { flex: none; font-size: 12px; }
.tstat.wait { color: var(--faint); animation: blink 1.2s infinite; } .tstat.ok { color: var(--ok); } .tstat.err { color: var(--err); }
.tbody { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
pre.code { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; overflow: auto;
           max-height: 420px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
pre.code.err { border-color: color-mix(in srgb, var(--err) 50%, var(--line)); }
.diff { font: 12.5px/1.45 var(--mono); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 420px; background: var(--code); }
.diff div { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .del { background: color-mix(in srgb, var(--err) 14%, transparent); }
.diff .add { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.todo { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.todo li::before { content: "○ "; color: var(--faint); } .todo li.completed::before { content: "● "; color: var(--ok); }
.todo li.in_progress::before { content: "◐ "; color: var(--person); }
.notice { align-self: center; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; width: 100%; }
.notice::before, .notice::after { content: ""; flex: 1; border-top: 1px dashed var(--line2); }

/* bridge */
.bridge { border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; height: 150px; flex: none; }
.bridge.min { height: auto; }
.bridge.min .blog { display: none; }
.bhead { display: flex; align-items: center; gap: 10px; padding: 6px 16px; font-size: 12px; cursor: pointer; user-select: none; }
.bhead b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--bridge); }
.status { font: 12px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.blog { flex: 1; overflow-y: auto; padding: 0 16px 8px; font: 12px/1.6 var(--mono); color: var(--muted); }
.blog div { white-space: pre-wrap; overflow-wrap: anywhere; }
.blog .to { color: var(--text); }
.blog .warn { color: var(--person); }

.overlay { position: fixed; inset: 0; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 85%, transparent);
           backdrop-filter: blur(6px); z-index: 10; padding: 16px; }
.overlay.show { display: grid; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; max-width: 380px; text-align: center; }
.card h2 { margin: 0 0 8px; font-size: 17px; } .card p { color: var(--muted); margin: 0 0 16px; }
.btn { display: inline-block; background: var(--task); color: #fff; text-decoration: none; border-radius: 9px; padding: 9px 16px; font-weight: 600; border: 0; cursor: pointer; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line2); margin-left: 6px; }

@media (max-width: 860px) {
  header { padding: 8px 16px 10px; }
  .tabs { display: flex; order: 5; }
  main { grid-template-columns: 1fr; }
  .pane { display: none; border-right: 0; }
  .pane.sel { display: flex; }
  .phead { display: none; }
  .feed { padding: 12px 16px; }
  .bridge { height: 120px; }
}
</style>
</head>
<body>
<header>
  <span class="live" id="live"><i></i><span id="livetxt">Connecting…</span></span>
  <div class="title" id="title">Live run</div>
  <span class="ro" title="Send changes as a comment on the card">View only</span>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<section class="bridge" id="bridge">
  <div class="bhead" id="bhead"><b>Bridge</b><span class="status" id="status">—</span><span id="btoggle" style="color:var(--faint)">▾</span></div>
  <div class="blog" id="blog"></div>
</section>
<div class="overlay" id="overlay"><div class="card" id="ocard"></div></div>

<script>
"use strict";
const NAMES = { worker: "Worker", adversary: "Supervisor" };
const SUBS = { worker: "does the task", adversary: "plans, verifies & approves" };
const panes = {}, tools = {};
let roles = ["worker", "adversary"], lastSeq = 0, es = null, selected = null;
try { selected = localStorage.getItem("live-pane"); } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const md = (text) => {
  const div = h("div", "md");
  try { div.innerHTML = DOMPurify.sanitize(marked.parse(text || "", { breaks: true, gfm: true })); }
  catch (e) { div.textContent = text || ""; div.style.whiteSpace = "pre-wrap"; }
  div.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  return div;
};
const clock = (ts) => {
  const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
  return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
};

function build() {
  const main = $("#main"), tabs = $("#tabs");
  main.innerHTML = ""; tabs.innerHTML = "";
  if (!roles.includes(selected)) selected = roles[0];
  for (const role of roles) {
    const pane = h("section", "pane"); pane.dataset.role = role;
    const head = h("div", "phead");
    head.append(h("span", "dot"), h("span", null, NAMES[role] || role), h("span", "sub", SUBS[role] || ""), h("span", "state", "idle"));
    const feed = h("div", "feed"); feed.append(h("div", "empty", "Waiting for activity…"));
    const jump = h("button", "jump", "↓ Latest");
    jump.onclick = () => { feed.scrollTop = feed.scrollHeight; };
    feed.addEventListener("scroll", () => {
      const p = panes[role]; p.stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
      jump.classList.toggle("show", !p.stick);
    });
    pane.append(head, feed, jump); main.append(pane);
    panes[role] = { pane, head, feed, jump, stick: true };
    const tab = h("button"); tab.dataset.role = role;
    tab.append(h("span", "dot " + role), h("span", null, NAMES[role] || role));
    tab.onclick = () => select(role); tabs.append(tab);
  }
  select(selected);
}
function select(role) {
  selected = role; try { localStorage.setItem("live-pane", role); } catch (e) {}
  for (const r of roles) {
    panes[r].pane.classList.toggle("sel", r === role);
    $(`.tabs button[data-role="${r}"]`).classList.toggle("sel", r === role);
  }
  const p = panes[role]; if (p.stick) requestAnimationFrame(() => { p.feed.scrollTop = p.feed.scrollHeight; });
  p.jump.classList.toggle("show", !p.stick);
}

function append(role, el) {
  const p = panes[role]; if (!p) return;
  const empty = $(".empty", p.feed); if (empty) empty.remove();
  p.feed.append(el);
  while (p.feed.childElementCount > 3000) p.feed.firstElementChild.remove();
  if (p.stick) p.feed.scrollTop = p.feed.scrollHeight;
}
function foldable(box, body) {
  box.append(body);
  requestAnimationFrame(() => {
    if (body.scrollHeight > 300) {
      box.classList.add("collapsed");
      const more = h("button", "more", "Show more");
      more.onclick = () => { const c = box.classList.toggle("collapsed"); more.textContent = c ? "Show more" : "Show less"; };
      box.append(more);
    }
  });
}
function who(label, ts) { const w = h("div", "who"); w.append(h("span", null, label)); const t = h("time", null, clock(ts)); w.append(t); return w; }

const ICONS = { Bash: "$", Read: "R", Edit: "E", MultiEdit: "E", Write: "W", Grep: "/", Glob: "*", WebFetch: "↗", WebSearch: "?",
                TodoWrite: "✓", Task: "A", Agent: "A", NotebookEdit: "N", ToolSearch: "⌕" };
function toolSummary(name, inp) {
  inp = inp || {};
  if (name === "Bash") return inp.description ? `${inp.description} — ${inp.command}` : inp.command;
  if (inp.file_path) return inp.file_path + (inp.offset ? `:${inp.offset}` : "");
  if (inp.pattern) return inp.pattern + (inp.path ? `  in ${inp.path}` : "");
  if (inp.url) return inp.url; if (inp.query) return inp.query;
  if (inp.description) return inp.description; if (inp.prompt) return inp.prompt;
  if (name === "TodoWrite") return `${(inp.todos || []).length} items`;
  const first = Object.values(inp).find(v => typeof v === "string"); return first || "";
}
function diffView(oldS, newS) {
  const d = h("div", "diff");
  for (const l of (oldS || "").split("\n")) d.append(h("div", "del", "− " + l));
  for (const l of (newS || "").split("\n")) d.append(h("div", "add", "+ " + l));
  return d;
}
function toolInput(name, inp) {
  const box = h("div"); inp = inp || {};
  if (name === "Bash") { box.append(h("div", "lbl", "Command"), h("pre", "code", inp.command || "")); }
  else if (name === "Edit") { box.append(h("div", "lbl", inp.file_path || "Edit"), diffView(inp.old_string, inp.new_string)); }
  else if (name === "MultiEdit") { box.append(h("div", "lbl", inp.file_path || "Edits")); for (const e of inp.edits || []) box.append(diffView(e.old_string, e.new_string)); }
  else if (name === "Write") { box.append(h("div", "lbl", inp.file_path || "Write"), h("pre", "code", inp.content || "")); }
  else if (name === "TodoWrite") { const ul = h("ul", "todo"); for (const t of inp.todos || []) { const li = h("li", t.status, t.content); ul.append(li); } box.append(ul); }
  else { box.append(h("div", "lbl", "Input"), h("pre", "code", JSON.stringify(inp, null, 2))); }
  return box;
}
function toolCard(ev) {
  const d = h("details", "tool");
  const s = h("summary");
  const name = (ev.name || "tool").replace(/^mcp__([^_]+(?:_[^_]+)*)__/, (m, srv) => `${srv.replace(/^plugin_|^claude_ai_/, "")}: `);
  s.append(h("span", "ticon", ICONS[ev.name] || (ev.name || "?").replace(/^mcp__/, "")[0].toUpperCase()),
           h("span", "tname", name), h("span", "tsum", toolSummary(ev.name, ev.input)));
  const st = h("span", "tstat wait", "…"); s.append(st);
  const body = h("div", "tbody"); body.append(toolInput(ev.name, ev.input));
  d.append(s, body);
  if (ev.id) tools[ev.id] = { d, st, body };
  return d;
}
function attachResult(ev) {
  const t = tools[ev.id];
  const pre = h("pre", "code" + (ev.error ? " err" : ""), ev.text || "(no output)");
  if (!t) { const d = h("details", "tool"); const s = h("summary"); s.append(h("span", "ticon", "↩"), h("span", "tname", "Result"),
            h("span", "tsum", (ev.text || "").split("\n")[0]), h("span", "tstat " + (ev.error ? "err" : "ok"), ev.error ? "✕" : "✓"));
            const b = h("div", "tbody"); b.append(pre); d.append(s, b); append(ev.role, d); return; }
  t.st.className = "tstat " + (ev.error ? "err" : "ok"); t.st.textContent = ev.error ? "✕ error" : "✓";
  t.body.append(h("div", "lbl", ev.error ? "Error" : "Result"), pre);
  if (ev.error) t.d.open = true;
}

function render(ev) {
  if (ev.seq) lastSeq = Math.max(lastSeq, ev.seq);
  if (ev.kind === "state") return showState(ev);
  if (ev.role === "bridge") return bridgeLine(ev);
  const role = ev.role;
  if (ev.kind === "prompt") {
    const box = h("div", "msg in src-" + ev.source); box.append(who(ev.label, ev.ts)); foldable(box, md(ev.text)); append(role, box);
  } else if (ev.kind === "text") {
    const box = h("div", "msg out role-" + role); box.append(who(NAMES[role] || role, ev.ts)); box.append(md(ev.text)); append(role, box);
  } else if (ev.kind === "thinking") {
    if (!ev.text && !ev.ms) return;   // nothing to say: the signature-only blocks
    const secs = ev.ms ? ` for ${(ev.ms / 1000).toFixed(1)}s` : "";
    const chip = h("span", "chip" + (ev.text ? " can" : ""), (ev.text ? "▸ " : "") + "Thought" + secs);
    append(role, chip);
    if (ev.text) { const t = h("div", "thought", ev.text); t.hidden = true; chip.onclick = () => { t.hidden = !t.hidden; chip.textContent = (t.hidden ? "▸ " : "▾ ") + "Thought" + secs; }; append(role, t); }
  } else if (ev.kind === "tool_use") { append(role, toolCard(ev)); }
  else if (ev.kind === "tool_result") { attachResult(ev); }
  else if (ev.kind === "notice") { append(role, h("div", "notice", ev.text)); }
  else if (ev.kind === "meta") { const box = h("div", "msg in src-bridge"); box.append(who(ev.label, ev.ts)); foldable(box, md(ev.text)); append(role, box); }
}
function bridgeLine(ev) {
  const log = $("#blog"), stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const cls = /→ /.test(ev.text) ? "to" : /stall|fail|error|denied|couldn't|killed|exited/i.test(ev.text) ? "warn" : "";
  log.append(h("div", cls, ev.text));
  while (log.childElementCount > 1500) log.firstElementChild.remove();
  if (stick) log.scrollTop = log.scrollHeight;
}
function showState(s) {
  $("#status").textContent = s.status || "—";
  for (const r of roles) {
    const busy = s.busy && s.busy[r];
    if (!panes[r]) continue;
    panes[r].pane.classList.toggle("busy", !!busy);
    $(".state", panes[r].head).textContent = busy ? "working" : (s.held && r === "worker" ? "on hold" : "idle");
    const tab = $(`.tabs button[data-role="${r}"]`); if (tab) tab.classList.toggle("busy", !!busy);
  }
  if (s.finished) setLive(false, "Finished: " + s.finished);
}
function setLive(on, text) { $("#live").classList.toggle("on", on); $("#livetxt").textContent = text; }
function overlay(title, text, actions) {
  const c = $("#ocard"); c.innerHTML = ""; c.append(h("h2", null, title), h("p", null, text));
  for (const a of actions || []) c.append(a);
  $("#overlay").classList.add("show");
}

async function load() {
  let r;
  try { r = await fetch("./history", { credentials: "same-origin", cache: "no-store" }); }
  catch (e) { setLive(false, "Not live"); overlay("This run isn't live", "The run has stopped, so there is nothing to show. Its record is on the card.", [retryBtn()]); return; }
  if (r.status === 401) {
    const go = h("a", "btn", "Sign in to kabana"); go.href = location.origin + "/"; go.target = "_blank"; go.rel = "noopener";
    setLive(false, "Signed out");
    overlay("Sign in to see this run", "This page shows a card's live run to the people on its board. Sign in to kabana, then come back.", [go, retryBtn()]);
    return;
  }
  if (!r.ok) { setLive(false, "Not live"); overlay("This run isn't live", `The run didn't answer (${r.status}). It may have stopped.`, [retryBtn()]); return; }
  const data = await r.json();
  $("#overlay").classList.remove("show");
  roles = Object.keys(data.roles || NAMES);
  if (data.card && data.card.title) {
    document.title = data.card.title + " · live";
    const t = $("#title"); t.innerHTML = "";
    const a = h("a", null, data.card.title); if (data.card.url) { a.href = data.card.url; a.target = "_blank"; a.rel = "noopener"; } t.append(a);
  }
  build();
  for (const ev of data.events) render(ev);
  showState(data.state || {});
  requestAnimationFrame(() => requestAnimationFrame(() => {   // after the folds have measured
    for (const r of roles) { const p = panes[r]; p.stick = true; p.feed.scrollTop = p.feed.scrollHeight; p.jump.classList.remove("show"); }
  }));
  connect();
}
function retryBtn() { const b = h("button", "btn ghost", "Try again"); b.onclick = () => { $("#overlay").classList.remove("show"); load(); }; return b; }
function connect() {
  if (es) es.close();
  es = new EventSource("./events?after=" + lastSeq);
  es.onopen = () => setLive(true, "Live");
  es.onmessage = (m) => { try { render(JSON.parse(m.data)); } catch (e) {} };
  es.onerror = () => { setLive(false, "Reconnecting…"); if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000); };
}
$("#bhead").onclick = () => { const b = $("#bridge"); const m = b.classList.toggle("min"); $("#btoggle").textContent = m ? "▸" : "▾"; };
window.addEventListener("resize", () => {
  for (const r of roles) { const p = panes[r]; if (p && p.stick) p.feed.scrollTop = p.feed.scrollHeight; }
});
build();
load();
</script>
</body>
</html>
